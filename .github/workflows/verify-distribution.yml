name: Verify distribution

# "All workflows green" != "live for users": winget and Chocolatey both go through
# external moderation queues that can take days. This job checks, daily, whether the
# latest release actually propagated to every channel, and maintains a single persistent
# tracking issue for the latest release status.
on:
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check each channel and manage the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail

          VERSION=$(gh release view --repo "$REPO" --json tagName --jq '.tagName' | sed 's/^v//')
          [[ -z "$VERSION" ]] && { echo "No release found; nothing to verify."; exit 0; }
          echo "Latest release: v$VERSION"

          pending=()
          report=""

          # ── winget: manifest folder exists in microsoft/winget-pkgs once merged ──
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/g/Glanvu/Glanvu/${VERSION}" \
               --silent >/dev/null 2>&1; then
            report+="- ✅ **winget** — \`${VERSION}\` merged into microsoft/winget-pkgs"$'\n'
          else
            # Not merged — find the open PR and surface anything genuinely blocking it.
            # Use the REST pulls endpoint with a head filter (immediate; the search API
            # lags behind freshly-created PRs).
            pr_json=$(gh api "repos/microsoft/winget-pkgs/pulls?state=open&head=juanyque:glanvu-${VERSION}" \
              --jq '.[0]' 2>/dev/null || true)
            if [[ -n "$pr_json" && "$pr_json" != "null" ]]; then
              pr_num=$(echo "$pr_json" | jq -r '.number')
              pr_url=$(echo "$pr_json" | jq -r '.html_url')
              head_sha=$(echo "$pr_json" | jq -r '.head.sha')
              pr_labels=$(echo "$pr_json" | jq -r '[.labels[].name] | join(", ")')
              # The "Needs-CLA" label is applied transiently on every new PR, then cleared
              # once the bot re-confirms the signature — so it is NOT a reliable signal.
              # Key off the authoritative license/cla commit status instead: only "failure"
              # means a signature is actually required.
              cla_state=$(gh api "repos/microsoft/winget-pkgs/commits/${head_sha}/status" \
                --jq '[.statuses[]? | select(.context=="license/cla")][0].state // ""' 2>/dev/null || true)
              extra=""
              if [[ "$cla_state" == "failure" ]]; then
                extra=" — **action needed: sign the CLA (comment \`@microsoft-github-policy-service agree\` on the PR)**"
              elif echo "$pr_labels" | grep -q "Changes-Requested"; then
                extra=" — **changes requested by a reviewer**"
              fi
              report+="- ⏳ **winget** — [PR #${pr_num}](${pr_url}) open (labels: ${pr_labels:-none})${extra}"$'\n'
            else
              report+="- ⏳ **winget** — not merged yet and no open PR found"$'\n'
            fi
            pending+=("winget")
          fi

          # ── Chocolatey: approved+listed packages appear in the public OData feed ──
          choco_url="https://community.chocolatey.org/api/v2/Packages(Id='glanvu',Version='${VERSION}')"
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "verify-distribution" "$choco_url" || echo "000")
          if [[ "$code" == "200" ]]; then
            report+="- ✅ **Chocolatey** — \`${VERSION}\` live on community.chocolatey.org"$'\n'
          elif [[ "$code" == "404" ]]; then
            report+="- ⏳ **Chocolatey** — not live yet (moderation queue)"$'\n'
            pending+=("Chocolatey")
          else
            report+="- ❔ **Chocolatey** — could not verify (HTTP ${code}); check manually"$'\n'
          fi

          # ── Homebrew + Scoop are direct pushes (no moderation) — sanity-check the tap ──
          if gh api "repos/glanvu/homebrew-glanvu/contents/Casks/glanvu.rb" --jq '.content' 2>/dev/null \
               | base64 -d 2>/dev/null | grep -q "version \"${VERSION}\""; then
            report+="- ✅ **Homebrew** — tap cask at \`${VERSION}\`"$'\n'
          else
            report+="- ⏳ **Homebrew** — tap cask not at \`${VERSION}\`"$'\n'
            pending+=("Homebrew")
          fi
          if gh api "repos/glanvu/scoop-glanvu/contents/bucket/glanvu.json" --jq '.content' 2>/dev/null \
               | base64 -d 2>/dev/null | grep -q "\"version\": \"${VERSION}\""; then
            report+="- ✅ **Scoop** — bucket at \`${VERSION}\`"$'\n'
          else
            report+="- ⏳ **Scoop** — bucket not at \`${VERSION}\`"$'\n'
            pending+=("Scoop")
          fi

          echo "$report"

          # Find any existing open tracking issue by label
          TRACK_LABEL="release-watch"
          TRACK_NUM=$(gh issue list --repo "$REPO" --state open --label "$TRACK_LABEL" \
            --json number --jq '.[0].number' 2>/dev/null || true)

          FOOTER="This single tracking issue is maintained automatically by daily distribution verification. Direct channels (Homebrew, Scoop) update on release; winget and Chocolatey clear external moderation."

          if [[ ${#pending[@]} -eq 0 ]]; then
            echo "All channels live for v${VERSION}; no tracking issue needed."
          else
            NEW_TITLE="[release-watch] v${VERSION} distribution status"
            printf -v BODY 'Automated distribution check for **v%s** (updated %s):\n\n%s\n%s' \
              "$VERSION" "$(date -u +%Y-%m-%dT%H:%MZ)" "$report" "$FOOTER"

            if [[ -n "$TRACK_NUM" ]]; then
              gh issue edit "$TRACK_NUM" --repo "$REPO" --title "$NEW_TITLE" --body "$BODY"
              echo "Updated tracking issue #${TRACK_NUM} (pending: ${pending[*]})."
            else
              gh issue create --repo "$REPO" --title "$NEW_TITLE" --body "$BODY" --label "$TRACK_LABEL"
              echo "Created tracking issue (pending: ${pending[*]})."
            fi
          fi
